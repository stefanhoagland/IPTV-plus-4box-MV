name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    needs: test
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/iptv-plus-4box-mv
    steps:
      - uses: actions/checkout@v4
      # Plain `docker build` on the runner's daemon: no QEMU/buildx images to pull from
      # Docker Hub (its anonymous pull limit breaks CI), and the base image comes from ECR.
      - run: docker build -t "$IMAGE:latest" -t "$IMAGE:sha-${GITHUB_SHA::7}" .
      - name: Smoke-test the image
        run: |
          docker run --rm --entrypoint ffmpeg "$IMAGE:latest" -hide_banner -version | head -1
          docker run -d --name smoke -e DATA_DIR=/tmp/config "$IMAGE:latest"
          for i in $(seq 1 20); do docker exec smoke node -e "fetch('http://127.0.0.1:9292/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))" && break; sleep 1; done
          docker exec smoke node -e "fetch('http://127.0.0.1:9292/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
          docker rm -f smoke
      - if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push --all-tags "$IMAGE"
